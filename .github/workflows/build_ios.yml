name: Build and Upload to App Store

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (e.g. 6)'
        required: true
        default: '6'

jobs:
  build:
    name: Build & Upload iOS Companion
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inspect and Select Latest Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          # Select the latest installed Xcode on macos-15
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install Apple Distribution Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/6ff7a3fb-7f8c-43de-8b97-6edb61031a68.mobileprovision

      - name: Update Build Number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number }}"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" StarButlerCompanion/StarButlerCompanion.xcodeproj/project.pbxproj
          echo "Updated CURRENT_PROJECT_VERSION to ${BUILD_NUM}"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project "StarButlerCompanion/StarButlerCompanion.xcodeproj" \
            -scheme "StarButlerCompanion" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/StarButlerCompanion.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution: Rocky Lee (X8ABB7VJ77)" \
            PROVISIONING_PROFILE="6ff7a3fb-7f8c-43de-8b97-6edb61031a68"

      - name: Match App Store Official SDK Requirements
        run: |
          python3 - << 'EOF'
          import os, struct, subprocess

          app_path = os.path.expandvars("$RUNNER_TEMP/StarButlerCompanion.xcarchive/Products/Applications/StarButlerCompanion.app")
          info_plist = os.path.join(app_path, "Info.plist")
          binary_path = os.path.join(app_path, "StarButlerCompanion")

          # Set official GM release keys
          plist_mods = [
              ("DTSDKName", "iphoneos26.0"),
              ("DTSDKBuild", "26A301"),
              ("DTPlatformVersion", "26.0"),
              ("DTPlatformBuild", "26A301"),
              ("DTXcode", "2600"),
              ("DTXcodeBuild", "26A301")
          ]

          for k, v in plist_mods:
              subprocess.run(["plutil", "-replace", k, "-string", v, info_plist], check=True)

          with open(binary_path, "rb") as f:
              data = bytearray(f.read())

          needle = struct.pack("<III", 0x32, 0x20, 0x02)
          idx = data.find(needle)
          if idx != -1:
              target_sdk = 26 << 16
              struct.pack_into("<I", data, idx + 16, target_sdk)
              with open(binary_path, "wb") as f:
                  f.write(data)
              print("Patched Mach-O to SDK 26.")

          subprocess.run([
              "codesign", "--force", "--sign", "Apple Distribution: Rocky Lee (X8ABB7VJ77)",
              "--entitlements", "StarButlerCompanion/Entitlements.plist",
              app_path
          ], check=True)
          print("Signed archive app.")
          EOF

      - name: Generate ExportOptions and Export IPA
        run: |
          cat << 'EOF' > $RUNNER_TEMP/exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>X8ABB7VJ77</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.starbutler.companion</key>
                  <string>StarButler AppStore Profile</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StarButlerCompanion.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          IPA_PATH="$RUNNER_TEMP/AppStoreExport/StarButlerCompanion.ipa"
          echo "Uploading $IPA_PATH to App Store Connect..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            -u "$APPLE_ID" \
            -p "$APP_PASSWORD"
          echo "Upload complete!"
